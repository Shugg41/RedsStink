# Runs the daily briefing / pregame sweep / closing snapshot from a REAL cron,
# in Python, to completion — instead of a Streamlit background thread that
# Community Cloud kills mid-run (which silently ate every day's notification).
#
# Each job inside jobs.py is ET-time-gated and marker-guarded, so firing this
# on every tick is idempotent — it no-ops until the right window opens and
# hasn't already run today.
#
# REQUIRED repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_KEY, ODDS_API_KEY, NTFY_TOPIC
# (same values already in the Streamlit app's secrets)
name: Daily jobs

on:
  schedule:
    # UTC. EDT = UTC-4. GitHub's scheduled runs fire LATE and unpredictably
    # (observed 40 min - 2 h behind), so the morning is deliberately dense: the
    # briefing gate opens at 9am ET (13:00 UTC), and four back-to-back morning
    # ticks give it several shots to land by ~10-10:30am ET even when GitHub is
    # slow. Every job is marker-guarded, so the extra ticks are free no-ops once
    # the briefing has gone out.
    - cron: "0 13 * * *"     # 9:00am ET  — earliest the briefing gate allows
    - cron: "20 13 * * *"    # 9:20am ET
    - cron: "40 13 * * *"    # 9:40am ET
    - cron: "0 14 * * *"     # 10:00am ET
    - cron: "30 14 * * *"    # 10:30am ET
    - cron: "0 16 * * *"     # midday / pregame sweep window
    - cron: "0 18 * * *"
    - cron: "0 20 * * *"
    - cron: "0 22 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-run & re-send today even if already run (clears today's markers)"
        type: boolean
        default: false

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless deps
        run: pip install --quiet requests python-dateutil
      - name: Run daily jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE: ${{ github.event.inputs.force }}
        run: python jobs.py
