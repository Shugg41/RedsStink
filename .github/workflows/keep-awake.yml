# Pings the Streamlit app on a schedule so Community Cloud never puts it to
# sleep — cold "waking up..." loads were taking 30-60s+.
#
# The APP_URL repository variable (Settings -> Secrets and variables ->
# Actions -> Variables) overrides the default below if the app ever moves.
name: Keep app awake

on:
  schedule:
    - cron: "23 */4 * * *"   # every 4 hours (sleep threshold is ~12h idle)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the app
        env:
          APP_URL: ${{ vars.APP_URL || 'https://redsstink1.streamlit.app' }}
        run: |
          echo "Pinging $APP_URL"
          curl -sSL --max-time 90 -o /dev/null -w "page: HTTP %{http_code}\n" "$APP_URL"
          curl -sSL --max-time 30 -o /dev/null -w "health: HTTP %{http_code}\n" "${APP_URL%/}/_stcore/health" || true
